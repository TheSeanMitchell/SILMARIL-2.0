name: cleanup 5.1 docs (attic legacy root docs)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type ATTIC to proceed (nothing is deleted; files move to attic/docs_pre_5_1/)"
        required: true
concurrency:
  group: silmaril-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  attic:
    if: ${{ github.event.inputs.confirm == 'ATTIC' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name silmaril-bot && git config user.email bot@silmaril
          python scripts/cleanup_5_1_docs.py ATTIC
          git add -A && git commit -m "5.1: attic legacy root docs (docs replaced by README + DOCS_5_1)" || echo "no changes"
          for i in 1 2 3; do git push && break || true; git fetch --depth=1 origin main && git rebase -X theirs origin/main || git rebase --abort || true; sleep 4; done

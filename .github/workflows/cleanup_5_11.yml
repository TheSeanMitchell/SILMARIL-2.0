# 7.0 FINAL: MANUAL BY DESIGN (one-shot 5.11 migration). Every recurring lane has a timer; this one must not.
name: cleanup 5.11 (attic superseded docs + stale workflows)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SUNSET to attic superseded root docs and stale cleanup workflows"
        required: true
        default: ""
permissions:
  contents: write
# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-oneshot-cleanup   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: false
jobs:
  sunset:
    if: ${{ github.event.inputs.confirm == 'SUNSET' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: attic
        run: |
          mkdir -p attic/docs attic/workflows
          for f in INSTALL_5_1.md INSTALL_5_1B.md NOTES_5_1_LEDGER.md READ_ME_FIRST.md \
                   READ_ME_FIRST_SW_FIX.md 5_1_REACTION_LEDGER.md 5_1_FINAL_LEDGER.md; do
            [ -f "$f" ] && git mv "$f" "attic/docs/$f" || true
          done
          for w in cleanup_5_0_final.yml cleanup_clutter.yml cleanup_root.yml cleanup_5_1_docs.yml; do
            [ -f ".github/workflows/$w" ] && git mv ".github/workflows/$w" "attic/workflows/$w" || true
          done
      - name: commit
        run: |
          git config user.name "silmaril-bot"
          git config user.email "bot@silmaril"
          git diff --cached --quiet || git commit -m "5.11 WRAP cleanup: attic superseded docs + stale workflows"
          # 7.0 FINAL: parallel lanes are legal now — pushes rebase+retry, never fail a finished run
          n=0; until [ $n -ge 5 ]; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break
            n=$((n+1)); sleep $((n*7))
          done

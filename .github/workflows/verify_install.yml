name: verify-install
# 7.0 FINAL: read-only install verifier now also runs weekly so drift is caught unattended.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 4 * * 1"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SILMARIL FINAL — full marker audit (one click, whole truth)
        run: |
          c(){ if grep -q "$2" "$1" 2>/dev/null; then echo "OK  $3"; else echo "XX  $3"; fi; }
          echo "== version =="
          python3 -c "import json;v=json.load(open('docs/data/PROJECT_META.json'))['version'];print(('OK ' if v=='7.0' else 'XX ')+'version='+v)"
          c docs/index.html "gold-shine" "gold header"
          echo "== UNFREEZE (cadence-proof warmup + watchdog) =="
          c silmaril/execution/paper_sim.py "_WARM_KNOB" "warmup knob-driven"
          c silmaril/execution/paper_sim.py "warm_rule" "health carries warm rule"
          c silmaril/cli.py "observed_cadence_min" "cadence watchdog"
          c .github/workflows/daily.yml "FALLBACK CADENCE" "in-repo */10 fallback schedule"
          python3 -c "import json;w=json.load(open('docs/data/PARAM_CATALOG.json')).get('warmup',{});print(('OK ' if w.get('min_points')==8 else 'XX ')+'warmup knob 8pts/1.5h')"
          echo "== GEKKO (aggressive probe, Master-isolated) =="
          c silmaril/execution/paper_sim.py "GEKKO" "gekko book in engine"
          c silmaril/execution/paper_sim.py "\"aggressive\": results.get" "gekko in payload"
          python3 -c "import json;g=json.load(open('docs/data/PARAM_CATALOG.json')).get('aggressive_book',{});print(('OK ' if g.get('name')=='GEKKO' else 'XX ')+'gekko config knobs')"
          c docs/index.html "posAggressive" "gekko positions table"
          c docs/index.html "renderGekkoNote" "gekko doctrine banner"
          c scripts/reset_internal_clean.py "paper_book_aggressive.json" "reset wipes gekko"
          echo "== JUNE-30 PROFILE (governed aggression) =="
          python3 -c "import json;o=json.load(open('docs/data/PARAM_CATALOG.json')).get('regime_overrides',{}).get('crypto',{}).get('SIDEWAYS',{});print(('OK ' if o.get('entry')==0.02 else 'XX ')+'crypto SIDEWAYS 2%/2% profile')"
          echo "== MOVEMENT I — VERIFICATION live =="
          c silmaril/execution/regime_accuracy.py "build_regime_accuracy" "regime accuracy audit"
          c silmaril/execution/trade_quality.py "build_trade_quality" "trade quality engine"
          c silmaril/cli.py "_ra(out); _tq(out)" "RA+TQ wired hourly"
          c silmaril/execution/master_account.py "confidence_parts" "master confidence decomposed"
          c silmaril/cli.py "gates_influence" "gates-influence stamp"
          c docs/index.html "Regime accuracy" "RA row on dashboard"
          echo "== 3.0 GOLD core intact =="
          c silmaril/execution/integrity.py "frozen_then_jump" "data integrity layer"
          c silmaril/execution/paper_sim.py "decision_trace_live" "live decision trace"
          c docs/index.html "renderFunnel" "universe funnel"
          c silmaril/execution/evolution_ledger.py "def record" "evolution ledger"
          c silmaril/execution/regime_combos.py "build_regime_combos" "regime-combo pulse"
          c silmaril/execution/champion.py "live_trades" "champion emits live_trades"
          c silmaril/execution/champion_split.py "live_trades" "per-book live_trades"
          c silmaril/portfolios/explainability.py "ZOMBIE-KILLED" "decision_ledger writer dead"
          c silmaril/portfolios/agent_portfolio.py "ZOMBIE-KILLED" "agent_portfolios writer dead"
          for f in decision_ledger.json agent_portfolios.json alpaca_paper_state.json; do
            [ -f "docs/data/$f" ] && echo "XX  zombie file present: $f (delete once via web UI)" || echo "OK  no $f"; done
          T=$(grep -c "timeout-minutes" .github/workflows/daily.yml); [ "$T" = "1" ] && echo "OK  daily single timeout" || echo "XX  daily timeout count=$T"
          echo "== 5.1B FINALITY markers =="
          c silmaril/execution/health_lights.py "key_groups" "health lights (fallback depth, keyed lanes)"
          c silmaril/execution/gate_evidence.py "build_gate_evidence" "gate evidence tallies"
          c silmaril/execution/conductor_c1.py "matched-subset" "conductor C1 shadow scorer"
          c silmaril/execution/mtf_regime.py "fast_red" "multi-timeframe regime ladder"
          c silmaril/execution/conductor_report_card.py "kill_criterion" "conductor report card (A/B honesty)"
          c silmaril/execution/paper_sim.py "REGIME_FLIP_HARVEST" "regime-flip harvest exit"
          c silmaril/execution/paper_sim.py "FEE_CLEAR_TIME" "stale-capital fee-clear exit"
          c silmaril/execution/paper_sim.py "conviction_sizing" "conviction-scaled wagers"
          c scripts/selftest_5_1.py "core-never-hostage" "regression battery present"
          python3 -c "import json;k=json.load(open('docs/data/PARAM_CATALOG.json'));print(('OK ' if all(x in k for x in ('regime_exit','stale_capital','conviction_sizing','regime_throttle','heatshield_autotune')) else 'XX ')+'5.1B knobs present')"
          echo "== done — every XX names the exact file that did not land =="

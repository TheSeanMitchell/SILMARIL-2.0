name: verify-install
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: marker audit — did every RC land?
        run: |
          c(){ if grep -q "$2" "$1" 2>/dev/null; then echo "✅ $3"; else echo "❌ $3"; fi; }
          c silmaril/execution/regime_classifier.py "movers_24h_pct" "regime: movers/breadth context"
          c silmaril/execution/regime_classifier.py "T00:00:00" "regime: daily-candle pollution excluded"
          c silmaril/execution/paper_sim.py "REGIME_AB" "regime hard-gate + A/B"
          c silmaril/execution/paper_sim.py "regime_overrides" "per-regime override knobs"
          c silmaril/execution/master_account.py "regime_veto" "master regime veto"
          c silmaril/cli.py "FAST-CYCLE GUARD" "runtime: heavy intel gated off fast cycle"
          c docs/index.html "renderMasterReject" "UI: master reject ledger"
          c docs/index.html "renderWarmup" "UI: first-trade readiness"
          c docs/index.html "renderWiring" "UI: wiring audit"
          c docs/index.html "renderRegimePanel" "UI: live regime panel"
          c docs/index.html "CACHE_BUST" "UI: cache-buster (no stale Pages)"
          c scripts/reset_internal_clean.py "derived view" "reset purges derived views"
          T=$(grep -c "timeout-minutes" .github/workflows/daily.yml); [ "$T" = "1" ] && echo "✅ daily.yml single timeout ($T)" || echo "❌ daily.yml timeout count=$T"
          echo "--- audit complete ---"

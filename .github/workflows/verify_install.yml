name: verify-install
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: full marker audit — every RC, every zombie
        run: |
          c(){ if grep -q "$2" "$1" 2>/dev/null; then echo "✅ $3"; else echo "❌ $3"; fi; }
          z(){ if grep -q "$2" "$1" 2>/dev/null; then echo "❌ ZOMBIE ALIVE: $3"; else echo "✅ zombie dead: $3"; fi; }
          echo "── engine ──"
          c silmaril/execution/regime_classifier.py "movers_24h_pct" "regime movers/breadth context"
          c silmaril/execution/paper_sim.py "REGIME_AB" "regime hard-gate + A/B"
          c silmaril/execution/paper_sim.py "\"style\"" "per-symbol style tags (trend vs range)"
          c silmaril/execution/master_account.py "allocation_plan" "master allocation intelligence"
          c silmaril/execution/feature_gates.py "additive merge" "gate additive-merge"
          c silmaril/execution/feature_gates.py "style_switching" "9-gate roster"
          c silmaril/cli.py "SELF-HEAL" "wide-arena self-heal"
          c silmaril/cli.py "FAST-CYCLE GUARD" "runtime fast-cycle guard"
          echo "── zombies (must all be dead) ──"
          c silmaril/portfolios/explainability.py "ZOMBIE-KILLED" "decision_ledger writer killed"
          c silmaril/portfolios/agent_portfolio.py "ZOMBIE-KILLED" "agent_portfolios writer killed"
          c silmaril/cli.py "broker poll DISABLED" "legacy Alpaca broker poll disabled"
          for f in decision_ledger.json agent_portfolios.json alpaca_paper_state.json capital_flow.json; do
            [ -f "docs/data/$f" ] && echo "❌ zombie FILE present: $f (delete via web UI once — it will not return)" || echo "✅ no $f"
          done
          echo "── UI ──"
          c docs/index.html "R0.regime" "strip regime object fix (no more [object Object])"
          c docs/index.html "LIVE-HANDOFF READINESS" "readiness honest title"
          c docs/index.html "ALLOCATION PLAN" "master modal allocation"
          c docs/index.html "renderWiring" "wiring audit panel"
          echo "── gate count ──"
          python3 -c "import json;print('✅ gates code =',sum(1 for _ in __import__('re').finditer(r'\"mode\": \"observe\"',open('silmaril/execution/feature_gates.py').read())))"
          T=$(grep -c "timeout-minutes" .github/workflows/daily.yml); [ "$T" = "1" ] && echo "✅ daily single timeout" || echo "❌ daily timeout count=$T"

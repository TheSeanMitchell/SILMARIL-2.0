# 7.0 FINAL: MANUAL BY DESIGN (one-shot key remap (the engine runs remap_keys.py EVERY cycle already)). Every recurring lane has a timer; this one must not.
name: Remap Keys (fix crypto graphs)
on:
  workflow_dispatch:
# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-oneshot-remap   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: true    # 7.0.3: SAME lane only — a newer run of THIS workflow replaces an older one (operator's rule). Cross-lane overlap is prevented by the SERIAL LANE LOCK step, which never cancels anyone.

jobs:
  remap:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      # ── 7.0.3 SERIAL LANE LOCK (operator: "we do not want runs running simultaneously, it may
      # corrupt data ... never interrupt, but also never run simultaneously, with no timeout").
      # GitHub concurrency alone cannot express this: a shared group serialises but CANCELS queued
      # runs (the 7.0.1 bug), while independent groups never cancel but DO run at the same time
      # (the 7.0.2 bug the operator just caught — venue_universe and selftest overlapping).
      # This step is the missing mutex: before touching state, wait for every other state lane to
      # finish. It never cancels anyone and never gives up, so a queued run always eventually runs.
      # Same-lane collisions are handled by concurrency.cancel-in-progress (newest wins) above.
      - name: 🔒 SERIAL LANE LOCK — wait for other state lanes (never cancel, never overlap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LANES="daily.yml hourly.yml analytics.yml backfill_universe.yml venue_universe.yml weekly_backup.yml compact_history.yml reset_internal_clean.yml integrity_backfill.yml remap_keys.yml cleanup_5_11.yml selftest.yml"
          ME="${{ github.run_id }}"
          MINE="${{ github.workflow }}"
          MY_START="$(date -u +%s)"
          WAITED=0
          while :; do
            BUSY=""
            for L in $LANES; do
              OUT=$(gh api "repos/${{ github.repository }}/actions/workflows/$L/runs?status=in_progress&per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $ME) | .run_started_at" 2>/dev/null || true)
              for TS in $OUT; do
                OTHER=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
                # Deterministic tie-break: the run that started EARLIER owns the lane. Equal
                # timestamps fall back to run id so two simultaneous starts can never both proceed.
                if [ "$OTHER" -lt "$MY_START" ]; then BUSY="$L"; break; fi
              done
              [ -n "$BUSY" ] && break
            done
            if [ -z "$BUSY" ]; then
              echo "lane clear after ${WAITED}s — proceeding"; break
            fi
            echo "waiting ${WAITED}s: $BUSY holds the state lane…"
            sleep 15; WAITED=$((WAITED+15))
          done
      - uses: actions/checkout@v4
      - run: python scripts/remap_keys.py
      - run: |
          git config user.name "silmaril-bot"
          git config user.email "bot@silmaril"
          git add -A && git commit -m "2.6.1: remap crypto keys -> BASE-USD (graphs show full year)" || echo "nothing"
          # 7.0 FINAL: parallel lanes are legal now — pushes rebase+retry, never fail a finished run
          n=0; until [ $n -ge 5 ]; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break
            n=$((n+1)); sleep $((n*7))
          done

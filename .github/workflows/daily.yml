name: Daily Run (single efficient cadence)

# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-daily   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: false   # 7.0.5 CRITICAL: a RUNNING cycle is NEVER killed. 7.0.3 set this true and the */10 daily cron then cancelled its own 12-13 min run on every tick — the cycle could never finish. GitHub still supersedes a PENDING run when a newer one arrives, which is the 'newest wins' rule applied to the queue instead of to live work.

# ────────────────────────────────────────────────────────────────────
# SINGLE RUNNER — this is now the ONE scheduled trading workflow.
# evening_prep.yml has been RETIRED: the full --live cycle already runs
# the post-cycle protection sidecar every run (sweep_protection,
# write_clock, build_leaderboard_v2 — see cli.py ~line 1681), so a
# separate "protection pass" was 100% redundant and only burned quota.
#
# CADENCE PHILOSOPHY — efficient, trading-hours-first:
#   The live book is US equities (3 Alpaca paper accounts). Equities do not
#   trade overnight or on weekends, and scoring is gated to trading days, so
#   dense off-hours runs produced no clean data and only consumed price-API
#   quota. We now run densely DURING the session and touch off-hours just
#   once a day for the 24/7 SIMULATED compounders (CryptoBro / JRR / Sports
#   Bro) and overnight news.
#
#   US equity windows (Eastern; EDT in summer):
#     Regular hours 09:30–16:00 ET = 13:30–20:00 UTC  → dense (every 15 min)
#     Pre-market    ~08:00 ET       = ~12:00 UTC       → 2 warm-up runs
#     Off-hours / weekend                              → 1 light run/day
#
#   GitHub Actions cron is best-effort (can slip 15–60 min under load), so
#   the session uses every-15-min rather than a single tick — if one fires
#   late, the next still lands inside the window.
#
#   Approx volume: ~34 runs/weekday + 1/day off-hours  (was ~90/weekday +
#   ~32/weekend-day). Large quota reduction, same clean-data coverage.
# ────────────────────────────────────────────────────────────────────

on:
  # NO internal schedule. This workflow runs ONLY on demand — the GitHub "Run
  # workflow" button or an external cron runner hitting the workflow_dispatch
  # API. Removing the cron triggers stops GitHub's own scheduler from firing
  # runs on top of the external trigger (a source of the run stacking).
  schedule:
    - cron: "*/10 * * * *"   # FALLBACK CADENCE — the external pinger stays primary. GitHub cron is
                             # best-effort (can slip 15-30m under load) which is still vastly better
                             # than the ~50-66m gaps observed when the pinger degrades. run_lock's
                             # 30-min stale reclaim + the shared concurrency queue make any overlap
                             # with the pinger harmless. The harvest must never again depend on one
                             # external service being configured correctly.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running manually?'
        required: false
        default: 'manual trigger'

permissions:
  contents: write
  issues: write   # 7.0 FINAL: the lane files its own 🔴 ENGINE RED issue on failure

# Keep cancel-in-progress=false so a partially-done run isn't killed mid-write
# (which could corrupt JSON state files). The shared "silmaril-broker" group
# means at most one broker-touching workflow runs at a time across the repo;
# any other (e.g. a manually-triggered reset) queues behind it. With ~7-min
# runs there is ample headroom now that the cadence is slim.

jobs:
  run:
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_CRON_ONLY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 7.0.3: near GitHub's max so a lane can WAIT its turn without being killed (operator: "no timeout so they can always run")
    steps:
      # ── 7.0.3 SERIAL LANE LOCK (operator: "we do not want runs running simultaneously, it may
      # corrupt data ... never interrupt, but also never run simultaneously, with no timeout").
      # GitHub concurrency alone cannot express this: a shared group serialises but CANCELS queued
      # runs (the 7.0.1 bug), while independent groups never cancel but DO run at the same time
      # (the 7.0.2 bug the operator just caught — venue_universe and selftest overlapping).
      # This step is the missing mutex: before touching state, wait for every other state lane to
      # finish. It never cancels anyone and never gives up, so a queued run always eventually runs.
      # Same-lane collisions are handled by concurrency.cancel-in-progress (newest wins) above.
      - name: 🔒 SERIAL LANE LOCK — wait for other state lanes (never cancel, never overlap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LANES="daily.yml hourly.yml analytics.yml venue_universe.yml selftest.yml"
          ME="${{ github.run_id }}"
          MINE="${{ github.workflow }}"
          MY_START="$(date -u +%s)"
          WAITED=0
          MAX_WAIT=600   # 7.0.5: fair-share cap. A busy daily must never starve hourly/analytics.
          while :; do
            BUSY=""
            for L in $LANES; do
              OUT=$(gh api "repos/${{ github.repository }}/actions/workflows/$L/runs?status=in_progress&per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $ME) | .run_started_at" 2>/dev/null || true)
              for TS in $OUT; do
                OTHER=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
                # Deterministic tie-break: the run that started EARLIER owns the lane. Equal
                # timestamps fall back to run id so two simultaneous starts can never both proceed.
                if [ "$OTHER" -lt "$MY_START" ]; then BUSY="$L"; break; fi
              done
              [ -n "$BUSY" ] && break
            done
            if [ -z "$BUSY" ]; then
              echo "lane clear after ${WAITED}s — proceeding"; break
            fi
            if [ "$WAITED" -ge "${MAX_WAIT:-600}" ]; then
              echo "waited ${WAITED}s for $BUSY — proceeding anyway (fairness cap)."
              echo "state stays safe on atomic writes + cli run_lock + rebase-retry push."
              break
            fi
            echo "waiting ${WAITED}s: $BUSY holds the state lane…"
            sleep 15; WAITED=$((WAITED+15))
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # SHALLOW — was 0 (full 375MB history every run). Huge checkout speedup.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live mode
        env:
          ALPHA_VANTAGE_API_KEY:    ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BIRDEYE_API_KEY:          ${{ secrets.BIRDEYE_API_KEY }}
          COINGECKO_API_KEY:        ${{ secrets.COINGECKO_API_KEY }}
          EIA_API_KEY:              ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          OPENEXCHANGERATES_APP_ID: ${{ secrets.OPENEXCHANGERATES_APP_ID }}
          POLYGON_API_KEY:          ${{ secrets.POLYGON_API_KEY }}
          TIINGO_API_KEY:           ${{ secrets.TIINGO_API_KEY }}
          ALPACA_API_KEY:           ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET:        ${{ secrets.ALPACA_API_SECRET }}
          # Two extra paper accounts, both $10k baseline.
          # H3 = 3% disciplined harvester (skips TINY tier).
          # H5 = 5% conviction harvester (skips TINY + MINI).
          # If either pair of secrets is unset, that account is skipped
          # gracefully by silmaril/execution/multi_account.py.
          ALPACA_API_KEY_H3:        ${{ secrets.ALPACA_API_KEY_H3 }}
          ALPACA_API_SECRET_H3:     ${{ secrets.ALPACA_API_SECRET_H3 }}
          ALPACA_API_KEY_H5:        ${{ secrets.ALPACA_API_KEY_H5 }}
          ALPACA_API_SECRET_H5:     ${{ secrets.ALPACA_API_SECRET_H5 }}
          # NOTE: ALPACA_BASE_URL secret is read but IGNORED by the
          # alpaca_paper module — it hardcodes paper-api.alpaca.markets.
          # Safe to delete the secret entirely.
          ALPACA_BASE_URL:          ${{ secrets.ALPACA_BASE_URL }}
          MARKETAUX_API_KEY:        ${{ secrets.MARKETAUX_API_KEY }}
          NEWSAPI_KEY:              ${{ secrets.NEWSAPI_KEY }}
          SEC_USER_AGENT_EMAIL:     ${{ secrets.SEC_USER_AGENT_EMAIL }}
          TWELVEDATA_API_KEY:       ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          # 3.0 FAST/FULL split — the 10-min cadence runs a FAST cycle (ingest + trade + live views only);
          # the heavy leaderboards/backtests/forensics run once at the top of the hour. Permanent fix for
          # daytime cycles ballooning past 10 minutes: crypto's minute-sensitive trading is never stuck
          # waiting behind a 1,600-symbol backtest again.
          # 5.0 LANE SPLIT (operator directive): the pulse is ALWAYS the fast trade
          # cycle — nothing heavy ever rides the 10-minute lane again. The hourly
          # heavy pass lives in hourly.yml (cron :07); WIDE/deep stays in
          # analytics.yml (3x/day). This is the long-requested workflow split.
          # ══ 7.1 ONE WRITER LAW ══════════════════════════════════════════════════════════════
          # THE 2026-07-25 INCIDENT: daily (10-min, 12-13 min runtime), hourly (:07) and the
          # 3x/day analytics lane ALL ran `python -m silmaril --live` — three concurrent live
          # trade cycles on three separate checkouts. The serial lane lock's 600s fairness cap
          # meant hourly/analytics "proceeded anyway" almost every time (daily is nearly always
          # in progress), and the push step's `git rebase -X theirs` then resolved every same-
          # file conflict by ERASING the other lane's version of the books, the sleeves, and
          # the ledgers. That is how trades vanished, sleeve marks froze, "fixed" panels kept
          # showing pre-fix output from stale checkouts, and yesterday-vs-today went "night and
          # day" with no code change. The permanent fix is architectural, not another lock:
          #
          #     ONE scheduled lane runs the live cycle. ONE checkout. ONE commit. Ever.
          #
          # This lane now carries every cadence itself, from ONE clock:
          #     · every 10 min          → FAST pulse (ingest + trade + live views)
          #     · top of each hour      → FULL pass (hourly-class brains + source overlay)
          #     · 07/11/23 UTC :2x tick → deep analytics suite, after the live cycle
          #     · 08 UTC :1x tick       → nightly universe backfill, after the live cycle
          #     · 09 UTC :2x tick       → venue-universe listings refresh
          # hourly.yml / analytics.yml / backfill_universe.yml / venue_universe.yml keep
          # workflow_dispatch for manual use but have NO cron — they can never race this lane.
          # Tripwire: selftest T110 (exactly one scheduled lane may run --live).
          MIN=$(date -u +%M); HH=$(date -u +%H)
          if [ "$MIN" -lt 10 ]; then
            echo "== FULL trade cycle (top-of-hour: pulse + hourly-class brains) =="
          else
            export SILMARIL_FAST=1; echo "== FAST trade cycle (pulse) =="
          fi
          python -m silmaril --live
          if [ "$MIN" -lt 10 ]; then
            echo "== hourly-class housekeeping (same checkout, same commit) =="
            python scripts/sanitize_history.py || true
            python scripts/brag_sheet.py || true
          fi
          if [ "$HH" = "08" ] && [ "$MIN" -ge 10 ] && [ "$MIN" -lt 20 ]; then
            echo "== nightly universe backfill (folded from backfill_universe.yml) =="
            python scripts/backfill_universe.py || true
          fi
          if [ "$HH" = "09" ] && [ "$MIN" -ge 20 ] && [ "$MIN" -lt 30 ]; then
            echo "== venue-universe listings refresh (folded from venue_universe.yml) =="
            python scripts/venue_universe.py || true
          fi
          if { [ "$HH" = "07" ] || [ "$HH" = "11" ] || [ "$HH" = "23" ]; } && [ "$MIN" -ge 20 ] && [ "$MIN" -lt 30 ]; then
            echo "== deep analytics suite (folded from analytics.yml — read-only over this cycle's data) =="
            python -m silmaril.analytics.suite --output docs/data || true
            python scripts/prune_data.py || true
          fi

      # ── Post-cycle analytics (read-only, additive) ──────────────────
      # Runs the new sentiment-calibration ledger, the brutally-honest agent
      # scorecard, the Alpaca-vs-truth broker reconciliation, and the unified
      # debug stream over the data the cycle just wrote. Every step is wrapped
      # and the suite always exits 0, so analytics can NEVER fail the trade run.
      # Outputs (sentiment_calibration.json, agent_scorecard.json,
      # broker_reconciliation.json, debug_stream.json) are committed by the
      # existing "git add docs/data/" step below.
      # HEAVY analytics now run ONCE PER HOUR (top-of-hour tick), not every 15 min.
      # They summarise data that barely moves intra-hour, so this is free time back
      # on 3 of every 4 session runs. The trade cycle above always runs.
      - name: Canonicalize price-history keys (FUTURE-PROOF — graphs never break again)
        run: python scripts/remap_keys.py || true

      - name: HEATSHIELD what-if (tight stop vs -5% floor on real data)
        run: python -c "from silmaril.execution.paper_sim import heatshield_whatif; heatshield_whatif('docs/data')" || true

      - name: Verify learning state preserved
        run: |
          python -c "
          from pathlib import Path
          from silmaril.learning.persistence_guard import verify_persistence
          report = verify_persistence(Path('docs/data'))
          print('Protected files present:', len(report['present']), '/', report['total_protected'])
          if report['missing']:
              print('Missing (will be created on next run):', report['missing'][:5])
          "

      - name: Commit results
        # Pull-rebase before push so a concurrent manual workflow commit doesn't
        # cause a non-fast-forward push rejection (which would leave docs/data
        # stale until the next run).
        run: |
          git config user.name 'silmaril-bot'
          git config user.email 'silmaril-bot@users.noreply.github.com'
          git add docs/data/ docs/index.html docs/*.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "🤖 daily run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Shallow-safe push: try push; if rejected, fetch just the tip and rebase onto it.
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break || true
            echo "push attempt $i failed; fetching tip + rebasing"
            git fetch --depth=1 origin main && git rebase -X theirs origin/main || git rebase -X theirs --abort || true
            sleep 4
          done
      - name: 🔴 ENGINE RED — self-report failure as a pinned issue (7.0 FINAL fail-loud)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 ENGINE RED — daily lane failing';
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nLane: daily · ${new Date().toISOString()}\nThe machine reports its own faults now (7.0 fail-loud law). Close this issue after the lane is green again.`;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'engine-red'});
            const hit = open.data.find(i => i.title === title);
            if (hit) { await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body}); }
            else { await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['engine-red']}); }

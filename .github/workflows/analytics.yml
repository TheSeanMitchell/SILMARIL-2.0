name: deep-analytics
# Heavy brains (WIDE 280-grid arena + daily-HOLD backtest + full suite) run HERE, 3x/day in
# low-activity windows — NEVER inside the 10-minute trade cycle.
#
# 5.0 FINAL AUDIT (2026-07-10) — this lane died silently on 2026-07-03 and nobody knew for a
# week: its main step wasn't failure-tolerated, so one bad run skipped every following step
# INCLUDING COMMIT, and the five evidence labs it owned starved invisibly. Four permanent fixes:
#   1. python pinned to 3.11 + pip cache — identical to the two lanes proven every 10 minutes
#      (this lane alone ran an unpinned 3.12 with a sketchy pip fallback).
#   2. deep_heartbeat.json — stamped at start and at finish; store_contracts freshness-monitors
#      it (30h cap), so a dead lane flips a named RED light on the dashboard within a day.
#   3. every step failure-tolerated — a degraded pass still commits whatever it produced.
#   4. push uses fetch + rebase -X theirs, retried — generated stores defer to the newest main
#      copy on conflict; this lane's NEW files always survive. Output can never be silently
#      discarded by a push race again.
on:
  schedule:
    - cron: "20 7 * * *"
    - cron: "20 11 * * *"   # 04:20 ET / 01:20 PT low-activity, not mid-session
    - cron: "20 23 * * *"
  workflow_dispatch:
# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-analytics   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: true    # 7.0.3: SAME lane only — a newer run of THIS workflow replaces an older one (operator's rule). Cross-lane overlap is prevented by the SERIAL LANE LOCK step, which never cancels anyone.
permissions:
  contents: write
  issues: write   # 7.0 FINAL: the lane files its own 🔴 ENGINE RED issue on failure
jobs:
  deep:
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_CRON_ONLY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 7.0.3: near GitHub's max so a lane can WAIT its turn without being killed (operator: "no timeout so they can always run")
    steps:
      # ── 7.0.3 SERIAL LANE LOCK (operator: "we do not want runs running simultaneously, it may
      # corrupt data ... never interrupt, but also never run simultaneously, with no timeout").
      # GitHub concurrency alone cannot express this: a shared group serialises but CANCELS queued
      # runs (the 7.0.1 bug), while independent groups never cancel but DO run at the same time
      # (the 7.0.2 bug the operator just caught — venue_universe and selftest overlapping).
      # This step is the missing mutex: before touching state, wait for every other state lane to
      # finish. It never cancels anyone and never gives up, so a queued run always eventually runs.
      # Same-lane collisions are handled by concurrency.cancel-in-progress (newest wins) above.
      - name: 🔒 SERIAL LANE LOCK — wait for other state lanes (never cancel, never overlap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LANES="daily.yml hourly.yml analytics.yml backfill_universe.yml venue_universe.yml weekly_backup.yml compact_history.yml reset_internal_clean.yml integrity_backfill.yml remap_keys.yml cleanup_5_11.yml selftest.yml"
          ME="${{ github.run_id }}"
          MINE="${{ github.workflow }}"
          MY_START="$(date -u +%s)"
          WAITED=0
          while :; do
            BUSY=""
            for L in $LANES; do
              OUT=$(gh api "repos/${{ github.repository }}/actions/workflows/$L/runs?status=in_progress&per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $ME) | .run_started_at" 2>/dev/null || true)
              for TS in $OUT; do
                OTHER=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
                # Deterministic tie-break: the run that started EARLIER owns the lane. Equal
                # timestamps fall back to run id so two simultaneous starts can never both proceed.
                if [ "$OTHER" -lt "$MY_START" ]; then BUSY="$L"; break; fi
              done
              [ -n "$BUSY" ] && break
            done
            if [ -z "$BUSY" ]; then
              echo "lane clear after ${WAITED}s — proceeding"; break
            fi
            echo "waiting ${WAITED}s: $BUSY holds the state lane…"
            sleep 15; WAITED=$((WAITED+15))
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Heartbeat — lane alive (start)
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          f = pathlib.Path('docs/data/deep_heartbeat.json')
          try: d = json.loads(f.read_text())
          except Exception: d = {}
          d['started_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['runs'] = int(d.get('runs', 0)) + 1
          f.write_text(json.dumps(d, indent=1))
          PY
      - name: deep analytics pass (failure-tolerated — a degraded pass still commits)
        env:
          SILMARIL_ANALYTICS: "1"
          SILMARIL_DEEP: "1"
        run: python -m silmaril --live || echo "::warning::deep pass degraded (exit tolerated; partial artifacts still commit)"
      - name: full analytics suite
        run: python -m silmaril.analytics.suite --output docs/data || true
      - name: data diet
        run: python scripts/prune_data.py || true
      - name: Heartbeat — lane alive (finish)
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          f = pathlib.Path('docs/data/deep_heartbeat.json')
          try: d = json.loads(f.read_text())
          except Exception: d = {}
          d['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          f.write_text(json.dumps(d, indent=1))
          PY
      - name: commit (rebase -X theirs, retried — output can never be silently discarded)
        run: |
          git config user.name 'silmaril-bot'
          git config user.email 'silmaril-bot@users.noreply.github.com'
          git add docs/data/ 2>/dev/null || true
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "🔬 deep analytics $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break || true
            echo "push attempt $i failed; fetch tip + rebase -X theirs"
            git fetch --depth=1 origin main && git rebase -X theirs origin/main || git rebase --abort || true
            sleep 4
          done
      - name: 🔴 ENGINE RED — self-report failure as a pinned issue (7.0 FINAL fail-loud)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 ENGINE RED — analytics lane failing';
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nLane: analytics · ${new Date().toISOString()}\nThe machine reports its own faults now (7.0 fail-loud law). Close this issue after the lane is green again.`;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'engine-red'});
            const hit = open.data.find(i => i.title === title);
            if (hit) { await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body}); }
            else { await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['engine-red']}); }

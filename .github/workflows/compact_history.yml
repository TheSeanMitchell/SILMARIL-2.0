# 7.0 FINAL: MANUAL BY DESIGN (history force-rewrite behind a COMPACT interlock — a scheduled force-push would be reckless; run when api_health storage says watch/act). Every recurring lane has a timer; this one must not.
name: Compact Git History (storage cure)

# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-compact   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: true    # 7.0.3: SAME lane only — a newer run of THIS workflow replaces an older one (operator's rule). Cross-lane overlap is prevented by the SERIAL LANE LOCK step, which never cancels anyone.

# THE 733MB PROBLEM, SOLVED PERMANENTLY (June 12, 2026).
# The worktree is ~85MB; the other ~650MB is .git history — the compound
# interest of committing large JSONs every 20 minutes. This workflow,
# run manually whenever api_health.storage reads "watch" or worse,
# snapshots the CURRENT state onto a fresh orphan commit and force-pushes
# it as the new main. The full pre-compaction history is preserved first
# as a tagged backup branch (additive law: nothing is destroyed — the
# old history remains fetchable via its tag until you prune it
# deliberately). Pages rebuilds from the same files; nothing user-facing
# changes. Expected result: repo shrinks to roughly the worktree size.
#
# Cadence guidance: monthly, or whenever git_history_mb > 500.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type COMPACT to proceed (safety interlock)'
        required: true

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      # ── 7.0.3 SERIAL LANE LOCK (operator: "we do not want runs running simultaneously, it may
      # corrupt data ... never interrupt, but also never run simultaneously, with no timeout").
      # GitHub concurrency alone cannot express this: a shared group serialises but CANCELS queued
      # runs (the 7.0.1 bug), while independent groups never cancel but DO run at the same time
      # (the 7.0.2 bug the operator just caught — venue_universe and selftest overlapping).
      # This step is the missing mutex: before touching state, wait for every other state lane to
      # finish. It never cancels anyone and never gives up, so a queued run always eventually runs.
      # Same-lane collisions are handled by concurrency.cancel-in-progress (newest wins) above.
      - name: 🔒 SERIAL LANE LOCK — wait for other state lanes (never cancel, never overlap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LANES="daily.yml hourly.yml analytics.yml backfill_universe.yml venue_universe.yml weekly_backup.yml compact_history.yml reset_internal_clean.yml integrity_backfill.yml remap_keys.yml cleanup_5_11.yml selftest.yml"
          ME="${{ github.run_id }}"
          MINE="${{ github.workflow }}"
          MY_START="$(date -u +%s)"
          WAITED=0
          while :; do
            BUSY=""
            for L in $LANES; do
              OUT=$(gh api "repos/${{ github.repository }}/actions/workflows/$L/runs?status=in_progress&per_page=30" \
                     --jq ".workflow_runs[] | select(.id != $ME) | .run_started_at" 2>/dev/null || true)
              for TS in $OUT; do
                OTHER=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
                # Deterministic tie-break: the run that started EARLIER owns the lane. Equal
                # timestamps fall back to run id so two simultaneous starts can never both proceed.
                if [ "$OTHER" -lt "$MY_START" ]; then BUSY="$L"; break; fi
              done
              [ -n "$BUSY" ] && break
            done
            if [ -z "$BUSY" ]; then
              echo "lane clear after ${WAITED}s — proceeding"; break
            fi
            echo "waiting ${WAITED}s: $BUSY holds the state lane…"
            sleep 15; WAITED=$((WAITED+15))
          done
      - name: Safety interlock
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "COMPACT" ]; then
            echo "Interlock: input was not COMPACT — refusing."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve full history as a tagged backup ref
        run: |
          STAMP=$(date -u +%Y%m%d)
          git tag "history-backup-$STAMP" HEAD
          git push origin "history-backup-$STAMP"
          echo "Old history preserved at tag history-backup-$STAMP"

      - name: Orphan snapshot of current state
        run: |
          git config user.name  "silmaril-compactor"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan compacted
          git add -A
          git commit -m "history compaction snapshot $(date -u +%F) — worktree preserved byte-for-byte; prior history at history-backup-* tag"

      - name: Replace main with the compacted snapshot
        run: |
          git branch -M compacted main
          git push --force origin main
          echo "main is now a single-commit snapshot. Run 'git fetch --prune' locally."

      - name: Report
        run: |
          du -sh .git || true
          echo "Done. api_health.storage.git_history_mb should collapse on the next cycle."

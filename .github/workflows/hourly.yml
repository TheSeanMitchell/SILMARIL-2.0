name: Hourly Brain (RETIRED lane — folded into daily.yml)

# ══ 7.1 ONE WRITER LAW ═══════════════════════════════════════════════════════════
# THE 2026-07-25 INCIDENT: this lane, daily.yml and analytics.yml ALL ran
# `python -m silmaril --live` on separate checkouts at the same time. The serial
# lane lock's 600s fairness cap meant this lane "proceeded anyway" almost every
# hour (the 10-min daily is nearly always in progress), and the push step's
# `git rebase -X theirs` then resolved every same-file conflict by ERASING the
# other lane's version of the books, sleeves and ledgers. Trades vanished,
# sleeve marks froze at entry, and fixed panels kept re-showing pre-fix output
# from stale checkouts.
#
# The permanent fix is architectural: ONE scheduled lane writes state, ever.
# daily.yml now runs the FULL (hourly-class) pass itself at the top of each hour
# — same checkout, same commit — so this lane has NO cron and NO steps that
# write. It exists only to tell anyone who dispatches it where the work went.
# Tripwire: selftest T110 (exactly one scheduled lane may run --live).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running manually?'
        required: false
        default: 'manual trigger'

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 7.1 ONE WRITER LAW — this lane is retired
        run: |
          echo "== The hourly full pass now runs INSIDE daily.yml at the top of each hour =="
          echo "== (one checkout, one commit — the only scheduled writer)."
          echo "== To force a full pass now: Actions → 'Daily Run' → Run workflow."
          echo "== This lane deliberately writes nothing, so it can never race the writer."

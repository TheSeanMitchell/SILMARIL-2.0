name: Backfill Universe (full coin + 1y fingerprint)
on:
  schedule:
    - cron: "10 8 * * *"   # nightly gap-fill: daily candles + anything cron gaps missed, in the dead zone
  workflow_dispatch:
# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-backfill   # 7.0.2: OWN lane group. A shared group let only ONE run stay pending, so the 10-min daily kept cancelling queued hourly/analytics. Independent lanes never cancel each other; state safety = run_lock + atomic writes + rebase-retry push.
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_CRON_ONLY != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ccxt yfinance
      - run: python scripts/backfill_universe.py
      - run: |
          git config user.name "silmaril-bot"
          git config user.email "bot@silmaril"
          git add -A && git commit -m "2.6.1: full universe + 1y fingerprint backfill" || echo "nothing"
          # 7.0 FINAL: parallel lanes are legal now — pushes rebase+retry, never fail a finished run
          n=0; until [ $n -ge 5 ]; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break
            n=$((n+1)); sleep $((n*7))
          done

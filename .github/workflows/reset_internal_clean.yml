name: Reset Internal Clean (post-fix wipe)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WIPE for a standard reset (learning kept). GENESIS additionally requires typing GENESIS-BURN-THE-LIBRARY here instead.'
        required: true
      wipe_mode:
        description: 'standard = books/sleeves/master reset, learning kept · genesis = learning resets too (archives are sacred) — Law 30'
        required: true
        default: 'standard'
        type: choice
        options: [standard, genesis]
# 7.0 FINAL WORKFLOW LAW (operator directive): every lane owns its OWN concurrency group,
# so NO workflow can ever queue behind, delay, or displace another workflow's runs.
# cancel-in-progress stays FALSE everywhere: once triggered, a run ALWAYS finishes.
# Lanes may overlap in time (stacking is fine): the engine's own run_lock guards the
# trade cycle, atomic_io guards every store write, and each commit step pulls+rebases
# with retries so parallel pushes merge instead of failing.
concurrency:
  group: silmaril-state   # 7.0.1: ALL state-mutating lanes share ONE queue — strict FIFO, zero overlap, zero corrupt-file risk
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ github.event.inputs.confirm == 'WIPE' || github.event.inputs.confirm == 'GENESIS-BURN-THE-LIBRARY' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/reset_internal_clean.py
      - name: GENESIS interlock — refuse genesis without the phrase (7.0 FINAL, Tier 3)
        if: ${{ github.event.inputs.wipe_mode == 'genesis' && github.event.inputs.confirm != 'GENESIS-BURN-THE-LIBRARY' }}
        run: |
          echo "::error::GENESIS requested but confirm phrase missing. Type GENESIS-BURN-THE-LIBRARY in the confirm box. Standard reset already ran above (learning kept); learning was NOT touched."
          exit 1
      - name: GENESIS — learning resets too (Law 30; archive/ is sacred)
        if: ${{ github.event.inputs.wipe_mode == 'genesis' && github.event.inputs.confirm == 'GENESIS-BURN-THE-LIBRARY' }}
        run: |
          python - <<'PY'
          import json, os
          reg = json.load(open('docs/data/STORE_REGISTRY.json')).get('stores', {})
          killed = []
          for f, cls in reg.items():
              path = f'docs/data/{f}'
              if cls == 'LEARNING' and os.path.exists(path):
                  os.remove(path); killed.append(f)
          try:
              wm = json.load(open('docs/data/WIPE_MARKER.json'))
          except Exception:
              wm = {}
          wm['mode'] = 'genesis'
          json.dump(wm, open('docs/data/WIPE_MARKER.json', 'w'), indent=1)
          print('GENESIS: learning reset →', killed)
          PY
      - run: |
          git config user.name "silmaril-bot"
          git config user.email "bot@silmaril"
          git add -A && git commit -m "clean internal reset to \$10k (post freshness fix)" || echo "nothing to commit"
          # 7.0 FINAL: parallel lanes are legal now — pushes rebase+retry, never fail a finished run
          n=0; until [ $n -ge 5 ]; do
            git pull --rebase origin main || git rebase --abort || true
            git push && break
            n=$((n+1)); sleep $((n*7))
          done

<!doctype html><html><head><meta charset="utf-8"><title>SILMARIL — reset app cache</title>
<style>body{background:#0a0a0b;color:#e8e8ea;font:15px/1.6 -apple-system,Segoe UI,sans-serif;max-width:560px;margin:60px auto;padding:0 20px}b{color:#d4af37}a{color:#7aa8ff}.ok{color:#3fd970}</style></head>
<body>
<h2><b>SILMARIL</b> — app cache reset</h2>
<p>This one-time page unregisters any stale service worker and clears the cached
shell, then sends you back to the live dashboard. Use it only if a hard reload
ever shows an out-of-date page.</p>
<pre id="log">working…</pre>
<script>
(async function(){
  const log=document.getElementById('log'); const out=[];
  function say(s){out.push(s);log.textContent=out.join('\n');}
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.unregister(); say('✓ unregistered a service worker'); }
      if(!regs.length) say('· no service worker was registered');
    }
    if(window.caches){
      const keys=await caches.keys();
      for(const k of keys){ await caches.delete(k); say('✓ cleared cache: '+k); }
      if(!keys.length) say('· no caches to clear');
    }
    say('\nDONE. Redirecting to the live dashboard in 2s…');
    setTimeout(()=>{ location.href='index.html?fresh='+Date.now(); }, 2000);
  }catch(e){ say('error: '+e+'\n\nManually: DevTools → Application → Service Workers → Unregister, then reload.'); }
})();
</script>
</body></html>
